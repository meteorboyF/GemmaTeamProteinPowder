<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7a"/>
    </marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f8a7e"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1f33" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="1180" fill="#f6f8fa"/>

  <text x="56" y="62" font-size="33" font-weight="700" fill="#0b1f33">User Flow &amp; Data Pipeline</text>
  <text x="56" y="94" font-size="18" fill="#5b6b7a">A three-step wizard. Nothing medical is generated from unconfirmed data.</text>
  <line x1="56" y1="112" x2="1544" y2="112" stroke="#d8dee4" stroke-width="2"/>

  <!-- stepper -->
  <circle cx="94" cy="164" r="21" fill="#0f8a7e"/>
  <text x="94" y="173" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Noto Sans Bengali">১</text>
  <text x="126" y="160" font-size="19" font-weight="700" fill="#0b1f33" font-family="Noto Sans Bengali">স্ক্যান</text>
  <text x="126" y="181" font-size="13.5" fill="#5b6b7a">Scan</text>
  <line x1="230" y1="164" x2="480" y2="164" stroke="#c9d3dc" stroke-width="3"/>
  <circle cx="512" cy="164" r="21" fill="#0f8a7e"/>
  <text x="512" y="173" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Noto Sans Bengali">২</text>
  <text x="544" y="160" font-size="19" font-weight="700" fill="#0b1f33" font-family="Noto Sans Bengali">যাচাই</text>
  <text x="544" y="181" font-size="13.5" fill="#5b6b7a">Verify</text>
  <line x1="646" y1="164" x2="896" y2="164" stroke="#c9d3dc" stroke-width="3"/>
  <circle cx="928" cy="164" r="21" fill="#0f8a7e"/>
  <text x="928" y="173" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Noto Sans Bengali">৩</text>
  <text x="960" y="160" font-size="19" font-weight="700" fill="#0b1f33" font-family="Noto Sans Bengali">ফলাফল</text>
  <text x="960" y="181" font-size="13.5" fill="#5b6b7a">Result</text>

  <!-- ═══ STEP 1 ═══ -->
  <rect x="56" y="216" width="420" height="356" rx="14" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M 56 230 a 14 14 0 0 1 14 -14 h 392 a 14 14 0 0 1 14 14 v 32 h -420 z" fill="#0f8a7e"/>
  <text x="80" y="248" font-size="16.5" font-weight="700" fill="#ffffff"><tspan font-family="Noto Sans Bengali">১</tspan> · <tspan font-family="Noto Sans Bengali">স্ক্যান</tspan> — capture &amp; extract</text>

  <text x="80" y="292" font-size="15" font-weight="700" fill="#0b1f33">Photograph the prescription</text>
  <text x="80" y="314" font-size="13.5" fill="#5b6b7a">camera_input or file_uploader</text>

  <rect x="80" y="330" width="372" height="1" fill="#e4e9ee"/>

  <text x="80" y="356" font-size="15" font-weight="700" fill="#0b1f33">Preprocess with PIL</text>
  <text x="80" y="378" font-size="13.5" fill="#5b6b7a">EXIF rotate · downscale to 1600px</text>
  <text x="80" y="398" font-size="13.5" fill="#5b6b7a">gentle autocontrast · JPEG re-encode</text>
  <text x="80" y="422" font-size="12.5" fill="#8b98a5" font-style="italic">Deliberately gentle — harsh thresholding</text>
  <text x="80" y="440" font-size="12.5" fill="#8b98a5" font-style="italic">hurts a vision model. On failure it returns</text>
  <text x="80" y="458" font-size="12.5" fill="#8b98a5" font-style="italic">the original bytes, so it never blocks.</text>

  <rect x="80" y="474" width="372" height="1" fill="#e4e9ee"/>

  <text x="80" y="500" font-size="15" font-weight="700" fill="#0f8a7e">Gemma 4 vision, to strict JSON</text>
  <text x="80" y="522" font-size="13.5" fill="#5b6b7a">few-shot prompt + shorthand glossary</text>
  <text x="80" y="542" font-size="13.5" fill="#5b6b7a">defensive parse into Prescription</text>
  <text x="80" y="562" font-size="12.5" fill="#c2410c" font-weight="600">"unreadable" is an encouraged answer</text>

  <rect x="56" y="592" width="420" height="72" rx="10" fill="#f0f3f6" stroke="#c9d3dc" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="80" y="616" font-size="11.5" font-weight="700" fill="#8b98a5" letter-spacing="1">DATA SHAPE</text>
  <text x="80" y="638" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#0b1f33">bytes → Prescription(medicines=[…],</text>
  <text x="80" y="656" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#0b1f33">  tests, advice, red_flags, confidence)</text>

  <!-- ═══ STEP 2 ═══ -->
  <rect x="516" y="216" width="420" height="356" rx="14" fill="#ffffff" stroke="#0f8a7e" stroke-width="3" filter="url(#sh)"/>
  <path d="M 516 230 a 14 14 0 0 1 14 -14 h 392 a 14 14 0 0 1 14 14 v 32 h -420 z" fill="#0f8a7e"/>
  <text x="540" y="248" font-size="16.5" font-weight="700" fill="#ffffff"><tspan font-family="Noto Sans Bengali">২</tspan> · <tspan font-family="Noto Sans Bengali">যাচাই</tspan> — the human gate</text>

  <text x="540" y="290" font-size="14.5" font-weight="700" fill="#c2410c">The extraction is shown, not trusted.</text>

  <rect x="540" y="304" width="372" height="142" rx="8" fill="#fbfcfd" stroke="#c9d3dc" stroke-width="1.5"/>
  <path d="M 540 312 a 8 8 0 0 1 8 -8 h 356 a 8 8 0 0 1 8 8 v 18 h -372 z" fill="#eef2f6"/>
  <text x="552" y="324" font-size="11" font-weight="700" fill="#5b6b7a" font-family="Noto Sans Bengali">যাচাই</text>
  <text x="600" y="324" font-size="11" font-weight="700" fill="#5b6b7a" font-family="Noto Sans Bengali">ওষুধ</text>
  <text x="690" y="324" font-size="11" font-weight="700" fill="#5b6b7a" font-family="Noto Sans Bengali">জেনেরিক</text>
  <text x="800" y="324" font-size="11" font-weight="700" fill="#5b6b7a" font-family="Noto Sans Bengali">ডোজ</text>
  <text x="856" y="324" font-size="11" font-weight="700" fill="#5b6b7a" font-family="Noto Sans Bengali">নিশ্চয়তা</text>

  <line x1="540" y1="330" x2="912" y2="330" stroke="#e4e9ee"/>
  <circle cx="558" cy="348" r="6" fill="#1a9c4a"/>
  <text x="600" y="352" font-size="12" fill="#0b1f33">Napa</text>
  <text x="690" y="352" font-size="12" fill="#0b1f33">Paracetamol</text>
  <text x="800" y="352" font-size="12" fill="#0b1f33">1+0+1</text>
  <rect x="856" y="344" width="40" height="8" rx="4" fill="#0f8a7e"/>

  <line x1="540" y1="364" x2="912" y2="364" stroke="#e4e9ee"/>
  <circle cx="558" cy="382" r="6" fill="#1a9c4a"/>
  <text x="600" y="386" font-size="12" fill="#0b1f33">Seclo</text>
  <text x="690" y="386" font-size="12" fill="#0b1f33">Omeprazole</text>
  <text x="800" y="386" font-size="12" fill="#0b1f33">1+0+0</text>
  <rect x="856" y="378" width="38" height="8" rx="4" fill="#0f8a7e"/>

  <line x1="540" y1="398" x2="912" y2="398" stroke="#e4e9ee"/>
  <rect x="541" y="399" width="370" height="30" fill="#fff8e6"/>
  <circle cx="558" cy="416" r="6" fill="#e0b94a"/>
  <text x="600" y="420" font-size="12" fill="#0b1f33">Cipro?in</text>
  <text x="690" y="420" font-size="12" fill="#0b1f33">Ciprofloxacin</text>
  <text x="800" y="420" font-size="12" fill="#0b1f33">1+0+1</text>
  <rect x="856" y="412" width="22" height="8" rx="4" fill="#e0b94a"/>
  <text x="552" y="441" font-size="10.5" fill="#a05a00">confidence 0.55 ≤ 0.70 threshold — flagged, and editable</text>

  <text x="540" y="470" font-size="13.5" fill="#5b6b7a">• Low-confidence rows are marked, not hidden</text>
  <text x="540" y="492" font-size="13.5" fill="#5b6b7a">• <tspan font-weight="700" fill="#0b1f33">generic</tspan> is a dropdown, not free text — it is</text>
  <text x="552" y="510" font-size="13.5" fill="#5b6b7a">the join key for every safety lookup</text>
  <text x="540" y="532" font-size="13.5" fill="#5b6b7a">• A human edit does <tspan font-weight="700" fill="#0b1f33">not</tspan> overwrite the model's</text>
  <text x="552" y="550" font-size="13.5" fill="#5b6b7a">confidence — that score is provenance</text>

  <rect x="516" y="592" width="420" height="72" rx="10" fill="#e9f7f5" stroke="#0f8a7e" stroke-width="2"/>
  <text x="540" y="616" font-size="11.5" font-weight="700" fill="#0b3d38" letter-spacing="1">THE GATE</text>
  <text x="540" y="638" font-size="13.5" font-weight="700" fill="#0b3d38">"We warned you" becomes "You confirmed."</text>
  <text x="540" y="657" font-size="12" fill="#3d6b66">One tap. The human is in the loop while an error is still cheap.</text>

  <!-- ═══ STEP 3 ═══ -->
  <rect x="976" y="216" width="568" height="356" rx="14" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M 976 230 a 14 14 0 0 1 14 -14 h 540 a 14 14 0 0 1 14 14 v 32 h -568 z" fill="#0f8a7e"/>
  <text x="1000" y="248" font-size="16.5" font-weight="700" fill="#ffffff"><tspan font-family="Noto Sans Bengali">৩</tspan> · <tspan font-family="Noto Sans Bengali">ফলাফল</tspan> — the medicine guide</text>

  <rect x="1000" y="282" width="252" height="122" rx="9" fill="#fff5f0" stroke="#c2410c" stroke-width="2"/>
  <text x="1016" y="306" font-size="14" font-weight="700" fill="#7a2a08"><tspan font-family="Noto Sans Bengali">সতর্কতা</tspan> — Safety panel</text>
  <text x="1016" y="328" font-size="12.5" fill="#8b5a3c">duplicate generic · interactions</text>
  <text x="1016" y="347" font-size="12.5" fill="#8b5a3c">max daily dose · red flags</text>
  <text x="1016" y="371" font-size="11" font-weight="700" fill="#c2410c">from drugs_bd.csv — never the model</text>
  <text x="1016" y="391" font-size="12" fill="#8b5a3c">shown first, HIGH severity on top</text>

  <rect x="1268" y="282" width="256" height="122" rx="9" fill="#eef4fb" stroke="#7ba7d7" stroke-width="2"/>
  <text x="1284" y="306" font-size="14" font-weight="700" fill="#1a4a7a"><tspan font-family="Noto Sans Bengali">কখন কোন ওষুধ</tspan></text>
  <text x="1284" y="328" font-size="12.5" fill="#3d6b8f"><tspan font-family="Noto Sans Bengali">সকাল</tspan> · <tspan font-family="Noto Sans Bengali">দুপুর</tspan> · <tspan font-family="Noto Sans Bengali">সন্ধ্যা</tspan> · <tspan font-family="Noto Sans Bengali">রাত</tspan> grid</text>
  <text x="1284" y="348" font-size="12.5" fill="#3d6b8f">antibiotic full-course tracker</text>
  <text x="1284" y="372" font-size="11.5" font-weight="700" fill="#1a4a7a">computed in Python, not generated</text>
  <text x="1284" y="392" font-size="12" fill="#3d6b8f">so grid and audio cannot disagree</text>

  <rect x="1000" y="416" width="252" height="112" rx="9" fill="#e9f7f5" stroke="#0f8a7e" stroke-width="2"/>
  <text x="1016" y="440" font-size="14" font-weight="700" fill="#0b3d38"><tspan font-family="Noto Sans Bengali">প্রতিটি ওষুধ সম্পর্কে</tspan></text>
  <text x="1016" y="462" font-size="12.5" fill="#3d6b66">purpose · how to take · caution</text>
  <text x="1016" y="483" font-size="11.5" font-weight="700" fill="#0f8a7e">Gemma generates, in plain Bangla</text>
  <text x="1016" y="503" font-size="12" fill="#3d6b66">short sentences, no English jargon,</text>
  <text x="1016" y="520" font-size="12" fill="#3d6b66">every caution ends at a pharmacist</text>

  <rect x="1268" y="416" width="256" height="112" rx="9" fill="#f0f3f6" stroke="#c9d3dc" stroke-width="1.5"/>
  <text x="1284" y="440" font-size="14" font-weight="700" fill="#0b1f33"><tspan font-family="Noto Sans Bengali">শুনুন</tspan> · Listen &amp; Save</text>
  <text x="1284" y="462" font-size="12.5" fill="#5b6b7a">Bangla audio of the timetable,</text>
  <text x="1284" y="480" font-size="12.5" fill="#5b6b7a">for people who cannot read it</text>
  <text x="1284" y="502" font-size="12.5" fill="#5b6b7a">save to SQLite history</text>
  <text x="1284" y="521" font-size="11" fill="#0f8a7e" font-weight="600">feeds the next scan's duplicate check</text>

  <text x="1000" y="551" font-size="11.5" fill="#8b98a5" font-style="italic">All three derived artifacts are computed once and cached in session. Streamlit reruns the</text>
  <text x="1000" y="567" font-size="11.5" fill="#8b98a5" font-style="italic">whole script on every click, so an uncached page would re-call the model on each one.</text>

  <rect x="976" y="592" width="568" height="72" rx="10" fill="#f0f3f6" stroke="#c9d3dc" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1000" y="616" font-size="11.5" font-weight="700" fill="#8b98a5" letter-spacing="1">DATA SHAPE</text>
  <text x="1000" y="638" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#0b1f33">confirmed Prescription → warnings[] + schedules[] + explanations{}</text>
  <text x="1000" y="656" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#0b1f33">→ mp3 bytes → SQLite row</text>

  <line x1="476" y1="394" x2="512" y2="394" stroke="#0f8a7e" stroke-width="3" marker-end="url(#aT)"/>
  <line x1="936" y1="394" x2="972" y2="394" stroke="#0f8a7e" stroke-width="3" marker-end="url(#aT)"/>

  <!-- ═══ FAILURE PATHS ═══ -->
  <text x="56" y="722" font-size="13" font-weight="700" fill="#8b98a5" letter-spacing="1.5">FAILURE PATHS — the UI never crashes, and never advances on bad data</text>
  <rect x="56" y="736" width="1488" height="180" rx="12" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5" filter="url(#sh)"/>

  <rect x="82" y="760" width="330" height="132" rx="9" fill="#fff5f0" stroke="#c2410c" stroke-width="1.5"/>
  <text x="102" y="786" font-size="14.5" font-weight="700" fill="#7a2a08">Model unreachable</text>
  <text x="102" y="808" font-size="12.5" fill="#8b5a3c">31B → backoff×3 → 26b-a4b → Ollama</text>
  <text x="102" y="827" font-size="12.5" fill="#8b5a3c">→ structured error document</text>
  <text x="102" y="851" font-size="12.5" font-weight="700" fill="#c2410c">Scan does not advance.</text>
  <text x="102" y="870" font-size="12.5" fill="#8b5a3c">Bangla error, a retry, and the last</text>
  <text x="102" y="886" font-size="12.5" fill="#8b5a3c">cached good result offered instead.</text>

  <rect x="436" y="760" width="330" height="132" rx="9" fill="#fff8e6" stroke="#e0b94a" stroke-width="1.5"/>
  <text x="456" y="786" font-size="14.5" font-weight="700" fill="#7a5b00">Malformed model output</text>
  <text x="456" y="808" font-size="12.5" fill="#7a5b00">markdown fences · trailing prose</text>
  <text x="456" y="827" font-size="12.5" fill="#7a5b00">confidence as "high", not 0.9</text>
  <text x="456" y="846" font-size="12.5" fill="#7a5b00">a bare list instead of an object</text>
  <text x="456" y="870" font-size="12.5" font-weight="700" fill="#a05a00">Parsed defensively or degraded —</text>
  <text x="456" y="886" font-size="12.5" fill="#7a5b00">never an exception. (RULE #10)</text>

  <rect x="790" y="760" width="330" height="132" rx="9" fill="#eef4fb" stroke="#7ba7d7" stroke-width="1.5"/>
  <text x="810" y="786" font-size="14.5" font-weight="700" fill="#1a4a7a">Handwriting illegible</text>
  <text x="810" y="808" font-size="12.5" fill="#3d6b8f">confidence ≤ 0.70 → row flagged</text>
  <text x="810" y="827" font-size="12.5" fill="#3d6b8f">unreadable → null, region described</text>
  <text x="810" y="851" font-size="12.5" font-weight="700" fill="#1a4a7a">Routed to "verify with your</text>
  <text x="810" y="868" font-size="12.5" font-weight="700" fill="#1a4a7a">pharmacist" — never guessed.</text>
  <text x="810" y="886" font-size="12.5" fill="#3d6b8f">(RULE #3)</text>

  <rect x="1144" y="760" width="374" height="132" rx="9" fill="#f0f3f6" stroke="#c9d3dc" stroke-width="1.5"/>
  <text x="1164" y="786" font-size="14.5" font-weight="700" fill="#0b1f33">No internet at all</text>
  <text x="1164" y="808" font-size="12.5" fill="#5b6b7a">Extraction and explanation run on-device</text>
  <text x="1164" y="827" font-size="12.5" fill="#5b6b7a">through local Ollama; the badge reads "local".</text>
  <text x="1164" y="851" font-size="12.5" font-weight="700" fill="#a05a00">Audio is the exception: gTTS is a cloud</text>
  <text x="1164" y="868" font-size="12.5" fill="#5b6b7a">service, so Listen degrades to text only.</text>
  <text x="1164" y="886" font-size="12.5" fill="#5b6b7a">We state that rather than hide it.</text>

  <!-- ═══ HISTORY LOOP ═══ -->
  <rect x="56" y="948" width="1488" height="116" rx="12" fill="#e9f7f5" stroke="#0f8a7e" stroke-width="2"/>
  <text x="82" y="978" font-size="17" font-weight="700" fill="#0b3d38">The history loop — what a single prescription review cannot catch</text>
  <text x="82" y="1004" font-size="13.5" fill="#3d6b66">Saved prescriptions store medicines as <tspan font-style="italic">rows</tspan>, so the next scan can query still-active drugs by generic without re-parsing history.</text>
  <text x="82" y="1026" font-size="13.5" fill="#3d6b66">Two doctors independently prescribing the same generic under different brand names is invisible to either prescription alone —</text>
  <text x="82" y="1048" font-size="13.5" font-weight="700" fill="#0b3d38">it is only visible across time. That cross-prescription duplicate check is the reason this whole persistence layer exists.</text>

  <path d="M 1544 1006 L 1562 1006 L 1562 394 L 1548 394" fill="none" stroke="#0f8a7e" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 56 1006 L 38 1006 L 38 394 L 52 394" fill="none" stroke="#0f8a7e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aT)"/>

  <line x1="56" y1="1110" x2="1544" y2="1110" stroke="#d8dee4" stroke-width="2"/>
  <text x="56" y="1140" font-size="13.5" fill="#8b98a5">Build With Gemma @ Bangladesh · GenAI for Good · Team Protein Powder</text>
  <text x="1544" y="1140" font-size="13.5" fill="#8b98a5" text-anchor="end">Interprets and reminds — never diagnoses, prescribes, or changes a dose.</text>
</svg>
